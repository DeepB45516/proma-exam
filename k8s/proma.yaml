# ProMa on K3s (one-node Kubernetes on the EC2 server).
#
# Before applying, replace the two placeholders in this file:
#   DOCKERHUB_USERNAME   your Docker Hub username (lowercase)
#   YOUR-BUCKET-NAME     your S3 bucket name
#
# This file contains NO passwords. They live in a Kubernetes Secret created on
# the server (see Step 8 of the guide):
#   kubectl create secret generic proma-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=CRON_SECRET="$(openssl rand -hex 24)"
#
# Apply with:  kubectl apply -f k8s/proma.yaml
---
# ---------------------------------------------------------------- database ---
# Storage for Postgres. K3s ships a "local-path" provisioner that turns this
# request into a folder on the server's disk, so data survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proma-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proma-db
spec:
  replicas: 1
  strategy:
    type: Recreate # a database volume can only be used by one pod at a time
  selector:
    matchLabels:
      app: proma-db
  template:
    metadata:
      labels:
        app: proma-db
    spec:
      # Run Postgres directly as its own user (uid 70) and switch off the default
      # AppArmor / seccomp confinement for this one pod. On newer Ubuntu kernels the
      # default profile blocks Postgres's processes from signalling each other
      # ("pg_ctl: could not send stop signal ... Permission denied"), and the
      # database never becomes ready.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: Unconfined
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: proma
            - name: POSTGRES_USER
              value: proma
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: proma-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "proma", "-d", "proma"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: proma-db-pvc
---
# Reachable only inside the cluster, under the name "proma-db".
apiVersion: v1
kind: Service
metadata:
  name: proma-db
spec:
  type: ClusterIP
  selector:
    app: proma-db
  ports:
    - port: 5432
      targetPort: 5432
---
# --------------------------------------------------------------------- app ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proma-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proma-app
  template:
    metadata:
      labels:
        app: proma-app
    spec:
      # Wait until Postgres accepts connections before starting the app.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z proma-db 5432; do echo waiting for database; sleep 2; done"]
      containers:
        - name: proma-app
          image: deepbiswas45516/proma-app:v2
          ports:
            - containerPort: 3000
          env:
            # Order matters: DATABASE_URL uses $(DB_PASSWORD) defined just above it.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: proma-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://proma:$(DB_PASSWORD)@proma-db:5432/proma?sslmode=disable
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: proma-secrets
                  key: JWT_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: proma-secrets
                  key: CRON_SECRET
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: v1
            # The page is served over plain HTTP on the server's IP address, so the
            # login cookie must not be marked "secure". Switch to true once you add
            # a domain and HTTPS.
            - name: COOKIE_SECURE
              value: "false"
            # Print e-mails (sign-up verification code) in the pod log when no mail
            # provider is configured. Ignored when SMTP_USER / SMTP_PASS are set.
            - name: EMAIL_CONSOLE_FALLBACK
              value: "true"
            # Cloud pipeline: upload activity events to this bucket. No access
            # keys: the SDK gets credentials from the EC2 instance's IAM role.
            - name: S3_BUCKET
              value: icem-proma-demo
            - name: AWS_REGION
              value: ap-south-1
            - name: ACTIVITY_DIR
              value: /app/activity
            # Optional real e-mail. Create the Secret "proma-smtp" to turn it on:
            #   kubectl create secret generic proma-smtp \
            #     --from-literal=SMTP_USER=you@gmail.com \
            #     --from-literal=SMTP_PASS=your-16-char-app-password
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: proma-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: proma-smtp
                  key: SMTP_PASS
                  optional: true
          volumeMounts:
            - name: activity
              mountPath: /app/activity
          # Kubernetes only sends visitors to the pod while /health answers 200,
          # and restarts the container if it stops answering.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
      volumes:
        # Folder on the server: ~/activity (= /home/ubuntu/activity). Event files
        # written inside the container appear there. Create it first with
        # "mkdir -p ~/activity" so the "ubuntu" user (uid 1000, the same uid as the
        # container's "node" user) owns it and can write to it.
        - name: activity
          hostPath:
            path: /home/ubuntu/activity
            type: DirectoryOrCreate
---
# Opens port 30080 on the server and forwards it to the app's port 3000.
apiVersion: v1
kind: Service
metadata:
  name: proma-app
spec:
  type: NodePort
  selector:
    app: proma-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — No Internet Connection | ProMa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233454D1%22/><rect x=%2226%22 y=%2244%22 width=%2212%22 height=%2230%22 rx=%223%22 fill=%22white%22/><rect x=%2244%22 y=%2230%22 width=%2212%22 height=%2244%22 rx=%223%22 fill=%22white%22/><rect x=%2262%22 y=%2218%22 width=%2212%22 height=%2256%22 rx=%223%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 24px;
    margin: 0;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-modal);
    max-width: 520px;
    width: 100%;
    padding: 48px 36px;
    text-align: center;
  }
  .error-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .error-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 12px;
  }
  .error-desc {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .error-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon" style="display:flex;align-items:center;justify-content:center;color:var(--accent);">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
    </div>
    <h1 class="error-title">No Internet Connection</h1>
    <p class="error-desc">It looks like your device is offline or unable to communicate with ProMa. Check your Wi-Fi or cellular connection and try again.</p>
    <div class="error-actions">
      <button onclick="window.location.reload()" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>Check Connection &amp; Retry</span>
      </button>
      <button onclick="window.history.back()" class="btn btn-ghost" style="display:inline-flex;align-items:center;gap:7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back</span>
      </button>
    </div>
  </div>
</body>
</html>
